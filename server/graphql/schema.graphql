}

input IssuePatchInput {
  id: ID!
  expectedRevision: Float
  title: String
  description: String
  priority: Int
  stateId: ID
  assigneeId: ID
  projectId: ID
  cycleId: ID
  milestoneId: ID
  parentId: ID
  dueAt: Float
  sortOrder: Float
  teamId: ID
  labelIds: [ID!]
