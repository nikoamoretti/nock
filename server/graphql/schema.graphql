}

input ProjectCreateInput {
  clientMutationId: ID!
  id: ID
  teamId: ID!
  name: String!
  description: String
  summary: String
  status: String
  health: String
  area: String
  leadId: ID
  startAt: Float
  targetAt: Float
  teamIds: [ID!]
}

