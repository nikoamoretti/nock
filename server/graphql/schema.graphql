  assigneeId: ID
  projectId: ID
  cycleId: ID
  milestoneId: ID
  parentId: ID
  dueAt: Float
  sortOrder: Float
  teamId: ID
  labelIds: [ID!]
  subscriberIds: [ID!]
  relatedIssueIds: [ID!]
  blockedByIds: [ID!]
  duplicateOfId: ID
}

input IssueArchiveInput {
  clientMutationId: ID!
  id: ID!
