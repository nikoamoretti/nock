  priority: Int
  stateId: ID
  assigneeId: ID
  projectId: ID
  cycleId: ID
  milestoneId: ID
  parentId: ID
  dueAt: Float
  sortOrder: Float
  number: Float
  identifier: String
  labelIds: [ID!]
  subscriberIds: [ID!]
}

input IssueUpdateInput {
  clientMutationId: ID!
  id: ID!
  expectedRevision: Float
  title: String
